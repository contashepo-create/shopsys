name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build, lint and user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Build-tool dependency audit
        # v1.0.15: العتبة high — ثغرة sprintf-js (moderate) داخل سلسلة
        # electron-builder (roarr/global-agent) مكتبة مهجورة بلا نسخة مصلحة،
        # ولا تخرج من أدوات البناء إلى حزمة المستخدم (production audit
        # منفصلة أدناه/أعلاه وتبعيات الإنتاج نظيفة). عند صدور إصلاح
        # upstream نعيد العتبة الافتراضية.
        run: npm audit --audit-level=high

      - name: TypeScript and production build
        run: npm run build

      - name: Lint application source with zero-warning policy
        run: npm run lint:strict

      - name: Browser-like integration tests
        run: npm run test:e2e

      - name: Business invariants, security and accounting journeys
        run: npm run verify:all
