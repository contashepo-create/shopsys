# بناء نسخة سطح المكتب «تَحَكَّم» (ويندوز NSIS) ونشرها على GitHub Releases.
# التشغيل: **بوسم إصدار v(X.Y.Z) حصراً** — دفع الوسم مباشرة أو إطلاق يدوي
# (workflow_dispatch على الوسم). حارس مبكر يرفض أي محفز على ref غير وسم
# إصدار خلال ثوانٍ قبل بناء 40 دقيقة — فلا نشر باسم فرع أبداً (لم نضف
# المحفز اليدوي إلا بعد أن صار حارس النشر فيه لازماً في كلتا الحالتين).
# لماذا المحفز اليدوي أصلاً: دفع الوسم من سير auto-release بـGITHUB_TOKEN
# لا يولد حدث push جديداً (منع recursion) — استثناء workflow_dispatch هو
# الطريق الموثّق؛ auto-release يستدعي هذا السير صراحةً بعد كل وسم.
# الوسم يأتي من مصدرين: يدوي (إصدار مدروس) أو آلي من سير auto-release
# (أي كود يصل main يوسم patch+1 تلقائياً — طلب المالك v1.0.17).
# الإصدار يقرأ من package.json، والتحديث التلقائي داخل التطبيق يقرأ من نفس
# الإصدارات (electron-updater، بلا توكن لأن المستودع عام).
name: desktop-release

on:
  push:
    tags:
      - 'v*'
  # محفز الطوارئ: يُستدعى من auto-release بعد وسم الإصدار، أو يدوياً:
  #   gh workflow run desktop-release --ref v1.0.21
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'بناء وفحص فقط — بلا إصدار أو نشر، يسمح باختبار فرع العمل'
        type: boolean
        default: false

# بناء واحد في كل مرة: وسمان متلاحقان يبنيان بالترتيب لا بالسباق
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: حارس المحفز — وسم إصدار v(X.Y.Z) حصراً (مدفوع أو مُطلق يدوياً)
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "✓ بناء تجريبي فقط — لا نشر ولا تعديل لقناة التحديث"
            exit 0
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✗ السير أُنشئ على «${GITHUB_REF_NAME}» وليس وسم إصدار v(X.Y.Z) — لا بناء ولا نشر"
            exit 1
          fi
          echo "✓ وسم إصدار ${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      - name: تطابق الوسم مع الإصدار ووجهة النشر قبل البناء
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          LOCK_VER=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ] || [ "${LOCK_VER}" != "${VER}" ]; then
            echo "::error::الوسم وpackage.json وpackage-lock.json غير متطابقة — لا بناء لإصدار ملتبس"
            exit 1
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASES_REPO_TOKEN غير مضبوط — لا بناء نشر بلا وجهة"
            exit 1
          fi
          gh api repos/contashepo-create/tahakam-releases --jq '.permissions.push' > ../publish-permission.txt
          if ! grep -qx true ../publish-permission.txt; then
            echo "::error::توكن رف النشر لا يملك صلاحية الكتابة"
            exit 1
          fi

      - name: تثبيت الاعتماديات
        run: npm ci

      # السلسلة الخضراء خطوةً خطوة — لا حزمة تكسر بوابة
      - name: فحص الأنواع
        shell: bash
        run: npm run typecheck 2>&1 | tee ../typecheck.log; exit ${PIPESTATUS[0]}

      - name: اختبارات المتصفح
        shell: bash
        run: npx vitest run 2>&1 | tee ../vitest.log; exit ${PIPESTATUS[0]}

      - name: بوابات الأعمال والرحلات
        shell: bash
        run: |
          npm run verify:all 2>&1 | tee ../verify.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "===== آخر 60 سطراً من سجل البوابات ====="
            tail -60 ../verify.log
            # بث الأسطر الحرجة كتعليقات توضيحية — تُقرأ عبر API حتى مع حجب سجلات CI
            grep -aE "فشل|خطأ|Error|error|Cannot|ENOENT|✗|AssertionError" ../verify.log | head -25 | cut -c1-220 | while IFS= read -r line; do
              echo "::error title=بوابات-الأعمال::${line//:/؛}"
            done
            exit "$code"
          fi

      - name: رفع سجلات السلسلة (للتشخيص — حتى عند النجاح)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-logs
          retention-days: 7
          path: |
            typecheck.log
            vitest.log
            verify.log

      # قناة تشخيص مضمونة: نشر ذيل سجل البوابات كتعليق على الالتزام
      # (تعليقات الالتزام تُقرأ عبر api.github.com حتى مع حجب مضيفي السجلات)
      - name: نشر ذيل سجل البوابات كتعليق على الالتزام
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          {
            echo "## سجلات تشخيص البناء الفاشل"
            if [ -f verify.log ]; then
              echo ""
              echo "### سياق أخطاء البوابات والرحلات"
              echo '```'
              grep -a -B3 -A15 -E "AssertionError|ERR_|Error \[" verify.log | head -c 22000 || true
              echo ""
              echo '```'
              echo "### مخرجات oxlint من بوابة الليت (حتى 10000 بايت)"
              echo '```'
              grep -a -A60 "مخرجات oxlint" verify.log | head -c 10000 || true
              echo '```'
              echo "### آخر 8000 بايت من سجل البوابات"
              echo '```'
              tail -c 8000 verify.log
              echo '```'
            fi
            if [ -f vitest.log ]; then
              echo ""
              echo "### vitest.log (آخر 2000 بايت)"
              echo '```'
              tail -c 2000 vitest.log
              echo '```'
            fi
          } > /tmp/comment.md
          # بلا إخفاء للأخطاء: فشل النشر نفسه يظهر كخطوة حمراء
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/comment.md

      # ── v1.0.16: ترحيل التحديث لرف الإصدارات العام ──────────────────────
      # المعمارية: البناء هنا (بلا توكن) → app-update.yml داخل المثبت يشير
      # لtahakam-releases → نشر صريح للرف العام بتوكن محصور → مرآة هنا
      # مرآة مصدر للتشخيص فقط؛ لا ترحيل مفترض لمستخدمين غير موجودين.
      # راجع docs/الترحيل-لمستودع-خاص.md

      - name: بناء المثبت (بلا نشر — النشر خطوات صريحة أدناه)
        id: build
        run: npm run desktop:dist

      - name: تحقق من توجيه التحديث داخل المثبت (رف الإصدارات العام)
        shell: bash
        run: |
          FEED="release/win-unpacked/resources/app-update.yml"
          if [ ! -f "${FEED}" ]; then echo "✗ app-update.yml غير موجود بالبناء — لا نشر لمثبت بلا وجهة تحديث"; exit 1; fi
          echo "═══ app-update.yml داخل المثبت ═══"
          cat "${FEED}"
          if ! grep -q "tahakam-releases" "${FEED}"; then
            echo "✗ المثبت لا يشير لرف الإصدارات العام — لا نشر يضلّل العملاء"; exit 1
          fi
          echo "✓ التحديث داخل المثبت موجه للرف العام tahakam-releases"

      - name: تحقق من حجم وبصمة المثبت وملفات التحديث
        shell: bash
        run: |
          node --input-type=module -e "import {validateDesktopArtifacts} from './scripts/releasePipeline.mjs'; import {readFileSync} from 'node:fs'; const version=JSON.parse(readFileSync('package.json','utf8')).version; console.log(validateDesktopArtifacts('release',version));"

      - name: حفظ حزمة البناء المفحوصة (بما فيها البناء التجريبي)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ github.run_id }}
          retention-days: 7
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml

      - name: تنزيل EXE v23 المنشور لاختبار أول انتقال قبل النشر
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.23 --repo contashepo-create/tahakam-releases --pattern latest.yml --pattern tahakom-setup-1.0.23.exe --pattern tahakom-setup-1.0.23.exe.blockmap --dir release-previous
          node --input-type=module -e "import {validateDesktopArtifacts} from './scripts/releasePipeline.mjs'; console.log(validateDesktopArtifacts('release-previous','1.0.23'));"

      - name: حاجز النشر — EXE القديم ثم المرشح ونفس profile/key وآخر عمل
        shell: pwsh
        run: |
          try { ./scripts/windows_installer_smoke.ps1 -FromPublished23 } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Pre-publication old-binary upgrade::$detail"
            throw
          }

      - name: نشر الإصدار إلى رف الإصدارات العام — draft ثم نشر بعد التحقق
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: contashepo-create/tahakam-releases
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/publish_desktop_release.mjs

      - name: مرآة حزمة المصدر — draft ثم نشر بعد التحقق
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/publish_desktop_release.mjs
