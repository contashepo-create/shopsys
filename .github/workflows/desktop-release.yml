# بناء نسخة سطح المكتب «تَحَكَّم» (ويندوز NSIS) ونشرها على GitHub Releases.
# التشغيل: يدوياً (workflow_dispatch من الفرع الافتراضي) أو بدفع وسم v* —
# الإصدار يقرأ من package.json، والتحديث التلقائي داخل التطبيق يقرأ من نفس
# الإصدارات (electron-updater، بلا توكن لأن المستودع عام).
name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: تثبيت الاعتماديات
        run: npm ci

      # السلسلة الخضراء خطوةً خطوة — لا حزمة تكسر بوابة
      - name: فحص الأنواع
        shell: bash
        run: npm run typecheck 2>&1 | tee ../typecheck.log; exit ${PIPESTATUS[0]}

      - name: اختبارات المتصفح
        shell: bash
        run: npx vitest run 2>&1 | tee ../vitest.log; exit ${PIPESTATUS[0]}

      - name: بوابات الأعمال والرحلات
        shell: bash
        run: |
          npm run verify:all 2>&1 | tee ../verify.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "===== آخر 60 سطراً من سجل البوابات ====="
            tail -60 ../verify.log
            # بث الأسطر الحرجة كتعليقات توضيحية — تُقرأ عبر API حتى مع حجب سجلات CI
            grep -aE "فشل|خطأ|Error|error|Cannot|ENOENT|✗|AssertionError" ../verify.log | head -25 | cut -c1-220 | while IFS= read -r line; do
              echo "::error title=بوابات-الأعمال::${line//:/؛}"
            done
            exit "$code"
          fi

      - name: رفع سجلات السلسلة (للتشخيص — حتى عند النجاح)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-logs
          retention-days: 7
          path: |
            typecheck.log
            vitest.log
            verify.log

      # قناة تشخيص مضمونة: نشر ذيل سجل البوابات كتعليق على الالتزام
      # (تعليقات الالتزام تُقرأ عبر api.github.com حتى مع حجب مضيفي السجلات)
      - name: نشر ذيل سجل البوابات كتعليق على الالتزام
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          {
            echo "## سجلات تشخيص البناء الفاشل"
            if [ -f verify.log ]; then
              echo ""
              echo "### سياق أخطاء البوابات والرحلات"
              echo '```'
              grep -a -B3 -A15 -E "AssertionError|ERR_|Error \[" verify.log | head -c 22000 || true
              echo ""
              echo '```'
              echo "### مخرجات oxlint من بوابة الليت (حتى 10000 بايت)"
              echo '```'
              grep -a -A60 "مخرجات oxlint" verify.log | head -c 10000 || true
              echo '```'
              echo "### آخر 8000 بايت من سجل البوابات"
              echo '```'
              tail -c 8000 verify.log
              echo '```'
            fi
            if [ -f vitest.log ]; then
              echo ""
              echo "### vitest.log (آخر 2000 بايت)"
              echo '```'
              tail -c 2000 vitest.log
              echo '```'
            fi
          } > /tmp/comment.md
          # بلا إخفاء للأخطاء: فشل النشر نفسه يظهر كخطوة حمراء
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/comment.md

      - name: بناء المثبت ونشره
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder (v26) قد يقسم أصول الإصدار على إصدارين بنفس الوسم
      # (exe في أحدهما وlatest.yml/blockmap في الآخر) — هذه الخطوة توحّدهما:
      # تحذف الإصدارات المكررة ثم ترفع latest.yml وblockmap لإصدار الوسم الرئيسي.
      - name: توحيد أصول الإصدار (latest.yml للتحديث التلقائي)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # الرئيسي = الإصدار الذي يحمل المثبت (exe) — ليس مجرد الأحدث؛
          # ترتيب API newest-first خدعنا في جولة سابقة فحذفنا إصدار الexe.
          MAIN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | select(.tag_name == \"${TAG}\") | select([.assets[].name] | any(test(\"\\\\.exe$\")))][0].id")
          if [ -z "$MAIN_ID" ] || [ "$MAIN_ID" = "null" ]; then
            echo "لا يوجد إصدار يحمل المثبت للوسم ${TAG}"
            exit 1
          fi
          echo "الإصدار الرئيسي (حامل المثبت): ${MAIN_ID}"
          # احذف الإصدارات المكررة الأخرى لنفس الوسم (بعد إفراغها)
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${TAG}\") | .id"); do
            if [ "$id" != "$MAIN_ID" ]; then
              echo "حذف الإصدار المكرر ${id}"
              for aid in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq '.[].id'); do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" || true
              done
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true
            fi
          done
          # ارفع ملفات التحديث من مخرجات البناء إلى الإصدار الرئيسي
          if [ -f release/latest.yml ]; then
            gh release upload "${TAG}" release/latest.yml --clobber
            echo "رُفع latest.yml ✓"
          else
            echo "release/latest.yml غير موجود!" && ls -la release/ && exit 1
          fi
          if compgen -G "release/*.blockmap" > /dev/null; then
            gh release upload "${TAG}" release/*.blockmap --clobber
            echo "رُفع blockmap ✓"
          fi
          # تحقق نهائي: exe + latest.yml معاً في إصدار واحد
          gh api "repos/${GITHUB_REPOSITORY}/releases/${MAIN_ID}" --jq '.assets[].name'
