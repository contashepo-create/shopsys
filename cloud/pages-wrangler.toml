# نشر نسخة الويب من «تَحَكَّم» على Cloudflare Pages — المرحلة ⑥ (كود جاهز، النشر بيد المالك)
# ─────────────────────────────────────────────────────────────────────────────
# هذا ملف Pages مستقل — لا يمسّ worker.js ولا wrangler.toml الخاص به
# (Worker قناة الدعم والترخيص له نشره وأسراره كما هو موثق هناك).
#
# الاستخدام (بعد قرار المالك بالنشر):
#   cd app && npm install && npm run build
#   cd .. && npx wrangler pages deploy app/dist --project-name tahakom
# أو ربط المستودع بـ Cloudflare Pages مباشرة (root: app · build: npm run build · output: dist).
#
# الصدق التقني: هذه نسخة الواجهة بالمتصفح — بيانات كل متجر تبقى محلية
# على جهازه (تخزين المتصفح) ولا تُرفع لأي سيرفر. نسخة سطح المكتب (EXE)
# هي الكاملة: قاعدة SQLite مشفرة + طباعة صامتة + إرسال PDF واتساب +
# التحديث التلقائي. المزامنة السحابية بين الأجهزة ليست في هذه المرحلة.

name = "tahakom-web"
compatibility_date = "2026-10-01"
pages_build_output_dir = "../app/dist"

# لا قواعد إضافية: لا Functions ولا KV ولا D1 للصفحات — النسخة تعمل بالكامل
# في متصفح المستخدم؛ أي خدمات مستقبلية (مزامنة/حسابات) تحتاج قراراً
# ومراجعة أمنية صريحة من المالك أولاً (Worker الدعم مستقل عنها).
