# مركز تحكم المطوّر — shopsys-control
# الاسم مطابق لقاعدة السحابة المضمّنة في العميل:
# app/src/core/cloud.ts → LICENSE_CLOUD_BASE_URL = 'https://shopsys-control.mobileshop2026.workers.dev'
name = "shopsys-control"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# تخزين واحد: سجل التراخيص + قائمة الحرق + حالة الأجهزة + نص «حول»
# أنشئه أولاً:  npx wrangler kv namespace create SHOPSYS_CONTROL
# ثم انسخ id هنا — ولو أردت نسخة معاينة (اختيارية): npx wrangler kv namespace create SHOPSYS_CONTROL_PREVIEW
[[kv_namespaces]]
binding = "SHOPSYS_CONTROL"
id = "3ed24436e5844f3d9159b5b823cf9b65"

# ─── التذكير اليومي بالاشتراكات (بند 3+4 من تدقيق 2026-10-08) ───
# الوقت بالتوقيت العالمي (UTC): 07:00 = العاشرة صباحاً بتوقيت القاهرة.
# لا اشتراكات منتهية ولا موشكة (≤ 10 أيام) ⇒ لا رسالة إطلاقاً (لا إزعاج فارغ)،
# وعلامة `digest-sent:<اليوم>` في KV تمنع التكرار لو أُطلق الجدول أكثر من مرة.
# نفس الملخص متاح عند الطلب بأمر `/تذكير [أيام]` وزر «⏳ الاشتراكات» في اللوحة.
[triggers]
crons = ["0 7 * * *"]

# ─── الأسرار (لا تُكتب هنا أبداً — تُضبط بأمر wrangler secret put) ───
#   TELEGRAM_BOT_TOKEN   توكن البوت من @BotFather
#   TELEGRAM_ADMIN_ID    معرّفك الرقمي (أرسل /start للبوت أو استخدم @userinfobot)
#   DEV_PRIVATE_KEY_B64U المفتاح الخاص من scripts/keygen.mjs
#   WEBHOOK_SECRET       سلسلة عشوائية طويلة تحمي رابط الـwebhook
#
# ─── جسر قناة الدعم (بند 1 من تدقيق 2026-10-08) ───
# محادثات الدعم مخزّنة في عامل cloud/worker.js، واللوحة والبوت هنا. بوت تليجرام
# واحد له ويبهوك واحد فقط — فبدون الجسر كان ردّك (Reply على بلاغ دعم) لا يصل
# للعميل أبداً. اضبط السرّ نفسه في العاملين:
#   wrangler secret put SUPPORT_BRIDGE_URL      ← رابط عامل الدعم (cloud/) كاملاً
#   wrangler secret put SUPPORT_BRIDGE_SECRET   ← 32 محرفاً عشوائياً فأكثر
# وفي مجلد cloud/:
#   wrangler secret put SUPPORT_BRIDGE_SECRET   ← القيمة نفسها حرفياً
# بدونها تبقى أوامر /دعم و/رد وزر «💬 الدعم» معطّلة برسالة إرشادية — ولا يتعطل
# أي شيء آخر في اللوحة.
