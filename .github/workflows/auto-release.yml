# الإصدار الآلي: main → خطة قابلة للاستئناف → دفع الالتزام والوسم ذرياً → إطلاق البناء.
# دفعة GITHUB_TOKEN لا تطلق push آخر؛ workflow_dispatch يحتاج actions: write.
name: auto-release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: حارس الفرع — الإصدار من main فقط
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::auto-release يقبل main فقط"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          # في إعادة المحاولة نقرأ حالة main الحالية، لا نسخة الحدث القديمة قبل رفع الإصدار.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: التحقق من رف النشر قبل أي تعديل أو وسم
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASES_REPO_TOKEN غير مضبوط — لم نغيّر الإصدار ولم ننشئ وسماً"
            exit 1
          fi
          gh api repos/contashepo-create/tahakam-releases --jq '.permissions.push' > publish-permission.txt
          if ! grep -qx true publish-permission.txt; then
            echo "::error::توكن رف النشر لا يملك صلاحية الكتابة — لا إصدار ناقص"
            exit 1
          fi
          rm publish-permission.txt

      - name: خطة الإصدار وحارس chore(release) القابل للاستئناف
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # prepare_release يستخدم ls-remote --tags origin لا الأوسمة المحلية للسحب الضحال.
        run: node app/scripts/prepare_release.mjs

      - name: إنشاء التزام الإصدار محلياً (package.json وpackage-lock.json معاً)
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "tahakam-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.version.outputs.tag }} — إصدار آلي قابل للاستئناف"
          fi

      - name: إنشاء الوسم أو التحقق من الوسم السابق دون تغييره
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # يكفي جلب الوسم المعين، ولا اعتماد على fetch-tags في checkout الضحال.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::الوسم ${TAG} يشير إلى مصدر مختلف — لن نحرك وسم إصدار موجود"
              exit 1
            fi
          else
            git tag -a "${TAG}" -m "تَحَكَّم ${TAG#v}"
          fi

      - name: دفع الالتزام والوسم معاً — لا package جديد بلا وسم
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          git push --atomic origin HEAD:main "refs/tags/${TAG}" > release-push.log 2>&1
          code=$?
          set -e
          cat release-push.log
          if [ "$code" -ne 0 ]; then
            # API annotations تحفظ سبب الفشل حتى لو تعذّر تنزيل سجلات Actions.
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=فشل دفع الإصدار::${line}"
            done < release-push.log
            exit "$code"
          fi

      - name: إطلاق desktop-release بصلاحية actions-write
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          gh workflow run desktop-release.yml --ref "${TAG}" > release-dispatch.log 2>&1
          code=$?
          set -e
          cat release-dispatch.log
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=فشل إطلاق البناء::${line}"
            done < release-dispatch.log
            exit "$code"
          fi
          echo "✓ قُبل طلب بناء ${TAG} — نجاح الإصدار يحدده desktop-release بعد الفحوص والبناء والنشر"

      - name: حفظ تشخيص الدفع والإطلاق
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-orchestration-logs
          retention-days: 14
          if-no-files-found: ignore
          path: |
            release-push.log
            release-dispatch.log
