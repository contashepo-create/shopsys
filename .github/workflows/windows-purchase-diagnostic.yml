name: Windows purchase UI and SQLite

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-purchase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build diagnostic fixture
        shell: pwsh
        run: |
          $env:PURCHASE_DIAGNOSTIC_OUT = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-build'
          npx vite build --config tests/windows/vite.purchase-diagnostic.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx esbuild tests/windows/purchase_diagnostic_main.ts --bundle --platform=node --format=cjs --external:electron --outfile="$env:RUNNER_TEMP/purchase-diagnostic-main.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx esbuild desktop/preload.ts --bundle --platform=node --format=cjs --external:electron --outfile="$env:RUNNER_TEMP/purchase-diagnostic-preload.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose module initialization in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          $fixture = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-build/tests/windows/purchase_diagnostic.html'
          $main = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-main.cjs'
          $preload = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-preload.cjs'
          $evidence = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic.json'
          $process = Start-Process -FilePath $exe -ArgumentList @("`"$main`"", "`"$fixture`"", "`"$preload`"", "`"$evidence`"") -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; throw 'Diagnostic main process did not exit' }
          if (-not (Test-Path $evidence)) { throw "Diagnostic produced no evidence (exit $($process.ExitCode))" }
          $raw = Get-Content $evidence -Raw
          Write-Output $raw
          $result = $raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            $detail = ($result.error + ' — ' + ($result.events -join ' | ')).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows renderer diagnostic::$detail"
            exit 1
          }
      - name: Build purchase UI and SQLite fixture
        shell: pwsh
        run: |
          $env:PURCHASE_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'purchase-ui-build'
          npx vite build --config tests/windows/vite.purchase.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-rebuild -f -w better-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx esbuild tests/windows/purchase_close_smoke.ts --bundle --platform=node --format=cjs --external:electron --external:better-sqlite3 --outfile="node_modules/.purchase-close-main.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Purchase UI save and close with SQLite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          $fixture = Join-Path $env:RUNNER_TEMP 'purchase-ui-build/tests/windows/purchase_close_fixture.html'
          $main = (Resolve-Path 'node_modules/.purchase-close-main.cjs').Path
          $preload = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-preload.cjs'
          $icon = (Resolve-Path 'public/app-icon.png').Path
          $evidence = Join-Path $env:RUNNER_TEMP 'purchase-close-evidence.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'purchase-electron-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'purchase-electron-err.log'
          $process = Start-Process -FilePath $exe -ArgumentList @("`"$main`"", "`"$fixture`"", "`"$preload`"", "`"$icon`"", "`"$evidence`"") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $stage = Join-Path $env:RUNNER_TEMP 'purchase-smoke-stage.json'
            $detail = if (Test-Path $stage) { Get-Content $stage -Raw } else { 'no stage' }
            throw "Purchase smoke timed out: $detail"
          }
          if (-not (Test-Path $evidence)) { throw "No purchase smoke evidence (exit $($process.ExitCode)): $(Get-Content $stdout -Raw) $(Get-Content $stderr -Raw)" }
          $raw = Get-Content $evidence -Raw
          Write-Output $raw
          $result = $raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            $detail = ($result.stage + ': ' + $result.error + ' — ' + ($result.logs -join ' | ')).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows purchase UI smoke::$detail"
            exit 1
          }
