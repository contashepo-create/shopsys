name: Deploy control worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Telegram controls and cloud notices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/devbot
          command: deploy
