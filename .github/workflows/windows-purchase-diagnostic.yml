name: Windows purchase renderer diagnostic

on:
  push:
    paths:
      - 'app/tests/windows/purchase_diagnostic*'
      - 'app/tests/windows/vite.purchase-diagnostic.config.ts'
      - '.github/workflows/windows-purchase-diagnostic.yml'

permissions:
  contents: read

jobs:
  renderer-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build diagnostic fixture
        shell: pwsh
        run: |
          $env:PURCHASE_DIAGNOSTIC_OUT = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-build'
          npx vite build --config tests/windows/vite.purchase-diagnostic.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx esbuild tests/windows/purchase_diagnostic_main.ts --bundle --platform=node --format=cjs --external:electron --outfile="$env:RUNNER_TEMP/purchase-diagnostic-main.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx esbuild desktop/preload.ts --bundle --platform=node --format=cjs --external:electron --outfile="$env:RUNNER_TEMP/purchase-diagnostic-preload.cjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose module initialization in Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          $fixture = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-build/tests/windows/purchase_diagnostic.html'
          $main = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-main.cjs'
          $preload = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic-preload.cjs'
          $evidence = Join-Path $env:RUNNER_TEMP 'purchase-diagnostic.json'
          $process = Start-Process -FilePath $exe -ArgumentList @("`"$main`"", "`"$fixture`"", "`"$preload`"", "`"$evidence`"") -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; throw 'Diagnostic main process did not exit' }
          if (-not (Test-Path $evidence)) { throw "Diagnostic produced no evidence (exit $($process.ExitCode))" }
          $raw = Get-Content $evidence -Raw
          Write-Output $raw
          $result = $raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) {
            $detail = ($result.error + ' — ' + ($result.events -join ' | ')).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows renderer diagnostic::$detail"
            exit 1
          }
